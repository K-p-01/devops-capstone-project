[nosetests]
verbosity = 2
with-spec = 1
spec-color = 1
with-coverage = 1
cover-package = service
cover-erase = 1
cover-min-percentage = 95

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 95

[flake8]
count = True
max-complexity = 10
max-line-length = 127
per-file-ignores =
    service/__init__.py: F401,E402

[pylint.'MESSAGES CONTROL']
disable = E1101
